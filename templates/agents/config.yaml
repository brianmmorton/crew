# crew — per-project config (<repo>/.crew/config.yaml). Versioned; edit per project.
# Tip: run `crew setup` to have an agent analyze your repo and fill most of this in.

project: ""                    # your project name

repo:
  path: "."                    # repo root, relative to this .crew/ parent
  baseBranch: main

# Which coding-agent CLI crew drives. "claude" is built-in (live streaming +
# subscription auth). For any other CLI (Codex, Cursor, Grok, a local script),
# set provider to anything else and configure the command:
#   agent:
#     provider: "codex"
#     command: "codex"            # the CLI binary on your PATH
#     args: ["exec"]              # base args before the prompt
#     promptVia: "stdin"          # "stdin" (piped) or "arg" (appended)
#     modelFlag: "--model"        # how to pass the model (omit if the CLI has none)
agent:
  provider: "claude"

linear:
  team: "YOUR LINEAR TEAM"     # exact team name as it appears in Linear
  # project: "My Repo"         # optional: scope this repo to one Linear project
                               # (name or id). Lets many repos share one team on
                               # the free plan and stay independent.
  labels:
    prd: "type:prd"
    bug: "type:bug"
    task: "type:task"
    chore: "type:chore-dx"
  statuses:
    backlog: "Backlog"
    ready: "Todo"
    inProgress: "In Progress"
    review: "In Review"
    needsApproval: "Needs Approval"   # add this status in Linear (unstarted type)
    done: "Done"
  approvedStates: ["Todo", "In Progress", "In Review", "Done"]

budget:
  target: max-monthly
  implementerWorkers: 1
  backoffMinutes: 30
  pollSeconds: 60

gates:
  wipCap: 3
  # Optional: prepare the env before verify (activate a runtime, install deps).
  # Runs in the same shell as the verify commands. Leave empty if not needed.
  # e.g. node:  "bash -lc 'nvm use >/dev/null' && pnpm install"
  #      python:"source .venv/bin/activate && pip install -r requirements.txt"
  setup: ""
  verify: {}                   # app -> command, e.g. { web: "npm test" }. `crew setup` fills this in.
  noTouch:                     # globs the Implementer must never modify
    - ".env*"
    - "**/migrations/**"
    - ".github/**"

# --- Models -----------------------------------------------------------------
# Each work item has a complexity (the complexity:low/medium/high label agents
# set, or you set by hand). The implementer runs on the model mapped here, so
# simple work uses a cheap model and hard work uses your strongest.
#
# Prefer SHORT ALIASES — they auto-track the latest version, so there are no
# model IDs to maintain:
#   haiku    – fastest & cheapest; small, low-risk changes
#   sonnet   – balanced; a solid everyday-coding default
#   opus     – strongest reasoning; complex / multi-file / risky changes
#   best     – highest-capability model available on your plan
#   opusplan – Opus while planning, Sonnet while editing (quality/cost mix)
# Empty "" = Claude Code's default model. To pin an exact version use a full id
# (e.g. claude-opus-5). To see what your plan offers: run `claude`, then `/model`.
models:
  default: ""
  byComplexity:
    low: "haiku"      # fast / cheap
    medium: "sonnet"  # balanced
    high: "opus"      # strongest

# --- Agents ------------------------------------------------------------------
# Every `personas/<name>.md` file is an agent. Add your own with
# `crew agent new <name>` (or just drop in a file) and list it with
# `crew agents`. Settings can live here OR as YAML frontmatter in the persona
# file itself; this block wins where both set the same field.
#
# Each agent has a `kind`:
#   proposer  read-only; analyzes the repo on a cadence and files work items
#   executor  claims a work item, implements it in a worktree, opens a PR
#   reviewer  runs after a PR opens; comments and (if allowed) moves the issue
#
# The built-ins default to the right kind, so they need only a cadence.
# Options every agent may set: model, description.
# Proposers/reviewers also: allowedTypes, maxProposals, label.
# Executors also: claims. Reviewers also: canTransitionTo.
personas:
  implementer: { cadence: "continuous" }
  qa:          { cadence: "0 */6 * * *" }
  # design:    { cadence: "0 9 * * 1,4" }   # enable if the project has a UI
  # architect: { cadence: "0 9 * * 2,5" }

  # Examples of custom agents (create the .md file first):
  #
  # A proposer restricted to filing at most 3 bugs, tagged for filtering:
  # a11y:
  #   kind: proposer
  #   cadence: "0 8 * * 1"
  #   allowedTypes: [bug]
  #   maxProposals: 3
  #   label: "agent:a11y"
  #
  # An executor that handles doc work instead of the implementer. Items whose
  # labels match `claims` route here; everything else still goes to implementer.
  # docs-writer:
  #   kind: executor
  #   claims: ["type:docs"]
  #   model: haiku
  #
  # A reviewer that inspects every PR. It may comment freely, but can only move
  # the issue to states you list here — anything else is refused by the engine.
  # security:
  #   kind: reviewer
  #   model: opus
  #   canTransitionTo: ["Todo"]

triager:
  cadence: "0 * * * *"
  dedupThreshold: 0.85
  backlogCap: 30
  # How many days a completed item keeps blocking a near-identical proposal, so
  # agents don't re-file work that just shipped. Canceled items block forever —
  # canceling is how you say "don't do this", and that shouldn't expire.
  dedupLookbackDays: 30

# When the executor runs out of work, pull a proposer in early instead of
# leaving the team idle until its next cron tick. One agent at a time,
# least-recently-run first.
idle:
  enabled: true
  # How long the queue must stay empty before triggering.
  afterMinutes: 10
  # Floor on how often any one proposer runs — applies to cron runs too, so the
  # two paths can't double up on each other.
  minIntervalMinutes: 30
  # Skip idle triggers while the backlog is deeper than this. A backlog means
  # work is waiting on you to promote it, not that the team is out of ideas.
  maxBacklog: 0
  # Stop triggering after this many idle runs file nothing. Resumes on its own
  # once the board changes. This is the backstop against a runaway idle loop.
  maxEmptyRuns: 3
  # Which proposers idle may run. Empty = all of them.
  agents: []
